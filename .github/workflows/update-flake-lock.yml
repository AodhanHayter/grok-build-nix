name: Update flake.lock

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Opening a PR from a workflow needs "Allow GitHub Actions to create and
      # approve pull requests" (Settings > Actions), which is enabled on this
      # repo. Separately, PRs opened with GITHUB_TOKEN never trigger CI — add a
      # PAT with `repo` scope as the FLAKE_LOCK_PAT secret if you want CI on them.
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ secrets.FLAKE_LOCK_PAT || secrets.GITHUB_TOKEN }}
          pr-title: 'chore: update flake.lock'
          pr-labels: |
            dependencies
            automated
